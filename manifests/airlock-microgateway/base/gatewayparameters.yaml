---
apiVersion: microgateway.airlock.com/v1alpha1
kind: GatewayParameters
metadata:
  name: gatewayparameters
  namespace: airlock-gateway
spec:
  logging:
    level: info
  kubernetes:
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
    deployment:
      replicas: 1
      placement: {}
      engineContainer: {}
      automountServiceAccountToken: false
  features:
    # MCP scenario: route to the external GitHub MCP service.
    externalNameServicesAllowed: true
    # MCP scenario: enable the Envoy MCP inspection filter.
    envoyExtensionPolicyEnabled: true
  defaults:
    contentSecurity:
      # Web protection scenario: enable WAAP processing with the default rules.
      secured: {}
    # OIDC scenario: manage gateway sessions in Valkey.
    sessionHandlingRef:
      name: sessionagent
    # MCP and tracing scenarios: use the shared telemetry configuration.
    telemetryRef:
      name: gateway-telemetry
