apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp
resources:
- service.yaml
- statefulset.yaml
configMapGenerator:
- name: iam-database-schema
  files:
  - create-medusa-schema.sql=files/create-medusa-schema.sql
  - insert-admin.sql=files/insert-admin.sql
generatorOptions:
  disableNameSuffixHash: true
