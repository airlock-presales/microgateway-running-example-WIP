apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airlock-iam-admin
spec:
  parentRefs:
  - name: mcp-https
    kind: ListenerSet
    namespace: mcp
    sectionName: mcp-https
  hostnames:
  - iam-mcp-127-0-0-1.nip.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth-admin
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-URL
          value: https://%REQ(:AUTHORITY)%%REQ(:PATH)%
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Port
          value: '8443'
    backendRefs:
    - name: airlock-iam
      port: 8080
