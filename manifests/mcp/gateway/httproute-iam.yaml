apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airlock-iam
spec:
  parentRefs:
  - name: mcp-https
    kind: ListenerSet
    namespace: mcp
    sectionName: iam-https
  hostnames:
  - iam-mcp-127-0-0-1.nip.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth-login
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-URL
          value: https://%REQ(:AUTHORITY)%%REQ(:PATH)%
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Port
          value: '8443'
    - type: CORS
      cors:
        allowOrigins:
        - http://localhost:6274
        - http://127.0.0.1:6274
        allowMethods:
        - GET
        - POST
        - OPTIONS
        allowHeaders:
        - content-type
        exposeHeaders:
        - WWW-Authenticate
    backendRefs:
    - name: airlock-iam
      port: 8080
