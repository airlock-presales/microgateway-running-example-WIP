apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-mcp
spec:
  parentRefs:
  - name: mcp-https
    kind: ListenerSet
    namespace: mcp
    sectionName: mcp-https
  hostnames:
  - github-mcp-iam-127-0-0-1.nip.io
  rules:
  - matches:
    - path:
        type: Exact
        value: /mcp
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: www-authenticate
          value: Bearer resource_metadata="https://github-mcp-iam-127-0-0-1.nip.io:8443/.well-known/oauth-protected-resource/mcp"
    - type: CORS
      cors:
        allowHeaders:
        - '*'
        allowMethods:
        - '*'
        allowOrigins:
        - http://localhost:6274
        - http://127.0.0.1:6274
        exposeHeaders:
        - Mcp-Session-Id
        - WWW-Authenticate
        - MCP-Protocol-Version
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: Authorization
          value: Bearer github_pat_xxxxxxx
    backendRefs:
    - name: github-mcp
      port: 443
