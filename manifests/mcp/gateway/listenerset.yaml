apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: mcp-https
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca-issuer
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: airlock-gateway
    namespace: airlock-gateway
  # cert-manager combines these hostnames into one certificate/Secret.
  listeners:
  - name: mcp-https
    hostname: github-mcp-iam-127-0-0-1.nip.io
    port: 8443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: mcp-gateway-tls
    allowedRoutes:
      namespaces:
        from: Same
  - name: iam-https
    hostname: iam-mcp-127-0-0-1.nip.io
    port: 8443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: mcp-gateway-tls
    allowedRoutes:
      namespaces:
        from: Same
  - name: iam-admin-https
    hostname: iam-admin-127-0-0-1.nip.io
    port: 8443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: mcp-gateway-tls
    allowedRoutes:
      namespaces:
        from: Same
  - name: dynamic-mcp-https
    hostname: mcp-iam-127-0-0-1.nip.io
    port: 8443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: mcp-gateway-tls
    allowedRoutes:
      namespaces:
        from: Same
