---
apiVersion: microgateway.airlock.com/v1alpha1
kind: CustomResponsePolicy
metadata:
  name: oauth-protected-resource
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: oauth-protected-resource
  policies:
    local:
      - responses:
          - statusCodeCondition:
              matcher:
                exact: 500
            customResponseRef:
              name: oauth-protected-resource
