apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-dynamic-metadata
spec:
  parentRefs:
  - name: mcp-https
    kind: ListenerSet
    namespace: mcp
    sectionName: mcp-https
  hostnames:
  - mcp-iam-127-0-0-1.nip.io
  rules:
  - matches:
    - path:
        type: Exact
        value: /.well-known/oauth-protected-resource/mcp
