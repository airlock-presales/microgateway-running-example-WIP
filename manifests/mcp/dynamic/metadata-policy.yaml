apiVersion: microgateway.airlock.com/v1alpha1
kind: CustomResponsePolicy
metadata:
  name: mcp-dynamic-metadata
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp-dynamic-metadata
  policies:
    local:
    - responses:
      - statusCodeCondition:
          matcher:
            exact: 500
        customResponseRef:
          name: mcp-dynamic-metadata
