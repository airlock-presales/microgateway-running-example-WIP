                    type: OAuth2NoClientAuthentication
                    id: mcpPublicClientAuthenticationDynamic
              userStore:
                ref: userStore
    securitySettings:
      type: SecuritySettings
      id: loginapSecuritySettings
      properties:
        encryptionKey:
        - var:
            name: IAM_LOGIN_ENCRYPTION_KEY
            sensitive: true
          value: '[FILE]/etc/iam-secrets/login-encryption-key'
        hmacKey:
        - var:
            name: IAM_LOGIN_HMAC_KEY
            sensitive: true
          value: '[FILE]/etc/iam-secrets/login-hmac-key'
        corsSettings:
          type: CorsSettings
          id: mcpInspectorCors
          properties:
            allowedOrigins:
            - valueList:
              - ^http://localhost:6274$
              - ^http://127\.0\.0\.1:6274$
              - ^https://iam-mcp-127-0-0-1\.nip\.io:8443$
            strictCorsValidation: true
    ui:
      type: LoginappUi
      id: loginappUiSettings
      properties:
        authenticationUi:
          type: AuthenticationUiConfigs
          id: authFlowUIs
          displayName: Authentication Flow UIs
          properties:
            flowUis:
            - pluginList:
              - type: AuthenticationUi
                id: demoApplicationUi
                displayName: Demo Authentication Flow UI
                properties:
                  cancellationTarget:
                    type: SameFlowRedirectTarget
                    id: sameFlowRedirectTarget
                  customizedStepUis:
                  - pluginList:
                    - type: LinkConfigurationAuthenticationStepUi
                      id: usernamePwdStepUiLinks
                      properties:
                        stepId:
                          ref: usernamePwdAuthStepId
                  maintenanceMessageUiSettings:
                    type: MaintenanceMessageUiSettings
                    id: maintMsgUi
                    displayName: Maintenance Message Flow Settings
                  targetApplicationId:
                    ref: demoApplicationId
                  targetURIResolver:
                    type: TargetURIResolver
                    id: mcpDemoRedirectTarget
                    displayName: Return to MCP Inspector by Default
                    properties:
                      allowedURIs:
                      - valueList:
                        - /(?!/).*
                      defaultValue: http://127.0.0.1:6274/
            nonFlowUiSettings:
              type: NonFlowAuthenticationUi
              id: nonFlowUiSettings
              properties:
                maintenanceMessageUi:
                  ref: maintMsgUi
            onLogout:
              type: RedirectOnLogout
              id: redirectAfterLogout
              properties:
                target:
                  type: ParameterBasedTargetUri
                  id: urlParmTargetUri
                  properties:
                    queryParameterUriExtractor:
                      type: QueryParameterURIValueExtractor
                      id: locationUrlParameter
                      properties:
                        allowedUriPatterns:
                        - valueList:
                          - /(?!/).*
                        parameterName: Location
        loginRestUiContentSecurityPolicy:
          type: LoginappUiContentSecurityPolicy
          id: loginappCsp
          properties:
            contentSecurityPolicy: 'default-src ''self''; object-src ''none''; script-src ${cspNonce} ''strict-dynamic''
              ''self'' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://hcaptcha.com
              https://*.hcaptcha.com; img-src ''self'' data: https://api.futurae.com; connect-src ''self'' https://api.futurae.com
              wss://api.futurae.com https://hcaptcha.com https://*.hcaptcha.com; base-uri ''self''; frame-ancestors
              ''none''; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://hcaptcha.com
              https://*.hcaptcha.com ''self''; style-src https://hcaptcha.com https://*.hcaptcha.com ''self'';'
- type: Adminapp
  id: adminapp
  displayName: adminapp
  properties:
    accessControl:
      type: RoleBasedAccessControl
