---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth-protected-resource
spec:
  parentRefs:
    - name: mcp-https
      kind: ListenerSet
      namespace: mcp
      sectionName: mcp-https
  hostnames:
    - github-mcp-127-0-0-1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp
