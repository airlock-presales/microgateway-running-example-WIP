apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-keycloak}
  template:
    metadata:
      labels: {app: mcp-keycloak}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.3
          args: [start-dev, --import-realm]
          env:
            - {name: KC_HOSTNAME, value: "https://auth-127-0-0-1.nip.io:8443"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: JAVA_OPTS_KC_HEAP, value: "-Xms64m -Xmx256m"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          readinessProbe:
            httpGet: {path: /realms/mcp, port: http}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: mcp-keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: mcp-keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-keycloak
spec:
  parentRefs:
    - name: mcp-https
      kind: ListenerSet
      namespace: mcp
      sectionName: mcp-https
  hostnames: [auth-127-0-0-1.nip.io]
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - {name: X-Forwarded-Proto, value: https}
              - {name: X-Forwarded-Port, value: "8443"}
      backendRefs:
        - {name: keycloak, port: 8080}
