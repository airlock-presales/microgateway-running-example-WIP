# MCP Router is terminal and must replace envoy.filters.http.router.
# EnvoyExtensionPolicy cannot express that replacement in Microgateway 5.2.
static_resources:
  listeners:
    - name: mcp
      address:
        socket_address: {address: 0.0.0.0, port_value: 8000}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp
                codec_type: AUTO
                route_config:
                  name: mcp
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        - match: {path: /mcp}
                          route: {cluster: echo, timeout: 30s}
                http_filters:
                  - name: envoy.filters.http.mcp
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.mcp.v3.Mcp
                      traffic_mode: REJECT_NO_MCP
                      max_request_body_size: 65536
                  - name: envoy.filters.http.mcp_router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.mcp_router.v3.McpRouter
                      servers:
                        - name: echo
                          mcp_cluster: {cluster: echo, path: /mcp, timeout: 10s}
                        - name: math
                          mcp_cluster: {cluster: math, path: /mcp, timeout: 10s}
  clusters:
    - name: echo
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: echo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: mcp-echo.mcp.svc.cluster.local, port_value: 8000}
    - name: math
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: math
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: mcp-math.mcp.svc.cluster.local, port_value: 8000}
