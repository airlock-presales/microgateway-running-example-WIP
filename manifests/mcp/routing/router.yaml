apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-router
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-router}
  template:
    metadata:
      labels: {app: mcp-router}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: router
          image: envoyproxy/envoy:v1.39.1
          args: [-c, /etc/mcp/envoy.yaml, --concurrency, "1", --log-level, info]
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/mcp, readOnly: true}
      volumes:
        - name: config
          configMap: {name: mcp-router-config}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-router
spec:
  selector: {app: mcp-router}
  ports:
    - {name: http, port: 8000, targetPort: http}
