apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-echo
spec:
  parentRefs:
    - name: airlock-gateway
      namespace: airlock-gateway
      sectionName: http
  hostnames: [mcp-echo-127-0-0-1.nip.io]
  rules:
    - matches:
        - path: {type: Exact, value: /mcp}
      backendRefs:
        - name: mcp-echo
          port: 8000
---
