apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: airlock-mcp-routing-dashboard
    files:
      - dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Airlock Microgateway
  - name: airlock-mcp-access-control-logs
    files:
      - accessCtrlMcpLogs.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Airlock Microgateway
  - name: airlock-mcp-access-control-metrics
    files:
      - accessCtrlMcpMetrics.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Airlock Microgateway
