---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: webserver
  namespace: oidc
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca-issuer
    cert-manager.io/common-name: webserver-127-0-0-1.nip.io
    cert-manager.io/private-key-size: "4096"
    cert-manager.io/usages: "server auth,digital signature"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: airlock-gateway
    namespace: airlock-gateway
  listeners:
  - name: https
    hostname: webserver-127-0-0-1.nip.io
    port: 8081
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: webserver-tls-cert
    allowedRoutes:
      namespaces:
        from: Same
